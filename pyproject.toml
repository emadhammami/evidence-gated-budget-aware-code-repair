[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-gated-budget-aware-code-repair"
version = "0.1.0"
description = "Controlled QuixBugs benchmark for evidence-guided budget-aware LLM code repair"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "google-genai>=1.0.0",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "benchmark*", "analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires external services or downloaded benchmarks",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".pytest_tmp"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
